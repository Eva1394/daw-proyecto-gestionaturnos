$kind: http-request
url: "{{baseUrl}}/api/secciones/999999"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Sección inexistente - 404 Not Found\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"La API devuelve el error en formato RFC 9457\", function () {\r

      \    const respuesta = pm.response.json();\r

      \r

      \    pm.expect(respuesta.status).to.eql(404);\r

      \    pm.expect(respuesta.detail).to.be.a(\"string\");\r

      \    pm.expect(respuesta.type).to.eql(\"about:blank\");\r

      });"
    language: text/javascript
order: 7000
