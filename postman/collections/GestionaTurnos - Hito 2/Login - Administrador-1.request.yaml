name: Login - Administrador
url: "{{baseUrl}}/api/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"admin@cifpaviles.es\",\r

    \  \"password\": \"Admin1234!\"\r

    }"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Login administrador - 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const respuesta = pm.response.json();\r

      \r

      if (pm.response.code === 200 && respuesta.token) {\r

      \    pm.collectionVariables.set(\"token\", respuesta.token);\r

      }\r\n"
    language: text/javascript
