$kind: http-request
url: "{{baseUrl}}/api/secciones"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: "{\r

    \  \"descripcion\": \"Prueba de validación sin nombre\",\r

    \  \"activa\": true\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Datos inválidos - 422 Unprocessable Content\", function () {\r

      \    pm.response.to.have.status(422);\r

      });\r

      \r

      pm.test(\"La API identifica el campo obligatorio\", function () {\r

      \    const respuesta = pm.response.json();\r

      \    pm.expect(respuesta.errors).to.have.property(\"nombre\");\r

      \    pm.expect(respuesta.errors.nombre).to.be.an(\"array\");\r

      });\r\n"
    language: text/javascript
order: 8000
